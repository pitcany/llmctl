[package]
name = "llmctl-cli"
description = "The llmctl-next CLI: composition root over llmctl-client and llmctl-daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "llmctl-next"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(llmctl_macos)'] }

[dependencies]
llmctl-core = { workspace = true }
llmctl-client = { workspace = true }
llmctl-daemon = { workspace = true }
llmctl-tui = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Already in the lockfile through tokio; used to restore SIGPIPE.
libc = "0.2.191"

[dev-dependencies]
tempfile = { workspace = true }
# backup: history_e2e makes a `.backup` copy of a WAL-mode DB.
rusqlite = { workspace = true, features = ["backup"] }
uuid = { workspace = true }

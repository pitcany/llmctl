      bash -lc "/Users/owner/AI/llama-swap/lms-free-llms.sh ; exec ${mtplx} serve --model /Users/owner/Models/mlx/pitcany/Qwen3.6-35B-A3B-MLX-8bit --model-id qwen3.6-35b-mtplx --host 127.0.0.1 --port ${PORT} --no-auth --no-stats-footer --profile sustained --context-window 32768 --depth 2 --reasoning off"

; llamacpp-router on the workstation (M5d pilot).
; Rendered by llmctl-next from its model records; edit with `llamacpp set`.
version = 1

; Every model inherits these unless its section sets the key.
[*]
flash-attn = on
jinja = true
n-gpu-layers = 999

; Pilot model 1: tiny, loads in seconds.
[qwen3.5-0.8b]
model = /mnt/storage/converted/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q8_0.gguf
mmproj = /mnt/storage/converted/Qwen3.5-0.8B-GGUF/mmproj-Qwen3.5-0.8B-F16.gguf
ctx-size = 32768 ; small on purpose
parallel = 2

; Pilot model 2: 37 GB, split over both cards.
[qwen3.6-35b-a3b]
model = /mnt/storage/converted/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q8_0.gguf
mmproj = /mnt/storage/converted/Qwen3.6-35B-A3B-GGUF/mmproj-Qwen3.6-35B-A3B-F16.gguf
ctx-size = 65536
tensor-split = 50,50
load-on-startup = false

; end of file

; Step 7 of M5d: gpt-oss-120b moves into the workstation router.
; Arguments copied unchanged from gpt-oss-120b.service (2026-11-18); the
; router sets host, port and alias (the section name).
[gpt-oss-120b]
model = /home/yannik/models/gpt-oss-120b/gpt-oss-120b-MXFP4.gguf
ctx-size = 131072
parallel = 1
n-gpu-layers = 999
n-cpu-moe = 6
tensor-split = 56,44
ubatch-size = 512
batch-size = 2048
threads = 16
flash-attn = on
jinja = true
slot-save-path = /home/yannik/.cache/gpt-oss/slots
cache-reuse = 256
